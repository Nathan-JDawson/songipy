[project]
name = "spotify-playlist-generator"
version = "0.1.0"
description = "Generate and sync Spotify playlists from your library and listening history."
requires-python = ">=3.12"
dependencies = [
    "spotipy",
    "python-dotenv",
    "psycopg[binary]",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
